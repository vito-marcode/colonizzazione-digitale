<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colonizzazione Digitale — Schermo Principale</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');

  :root {
    --bg:#05070a; --blue:#38bdf8; --red:#ef4444; --text:#f3f4f6;
    --card:#111827; --border:#1f2937;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  html, body { height:100%; overflow:hidden; }

  body {
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
  }

  /* ── Heart overlay (sopra tutto) ─────────────────────── */
  #heart-overlay {
    position:fixed; inset:0; pointer-events:none; z-index:9999;
    overflow:hidden;
  }

  .heart-particle {
    position:absolute;
    bottom:-60px;
    font-size:2rem;
    animation: floatUp 2.5s ease-out forwards;
    user-select:none;
    pointer-events:none;
  }

  @keyframes floatUp {
    0%   { transform: translateY(0) scale(1) rotate(0deg);   opacity:1; }
    60%  { opacity:1; }
    100% { transform: translateY(-70vh) scale(0.4) rotate(20deg); opacity:0; }
  }

  /* ── Settings Panel ──────────────────────────────────── */
  #settings-btn {
    position:fixed; bottom:1.5rem; right:1.5rem; z-index:1000;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);
    border-radius:50%; width:44px; height:44px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:1.2rem; transition:all .2s;
    backdrop-filter:blur(8px);
  }
  #settings-btn:hover { background:rgba(255,255,255,.15); }

  #settings-panel {
    position:fixed; bottom:4.5rem; right:1.5rem; z-index:1000;
    background:#111827; border:1px solid #374151;
    border-radius:16px; padding:1.2rem; width:260px;
    display:none; flex-direction:column; gap:.8rem;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  #settings-panel.open { display:flex; }

  .settings-title {
    font-size:.7rem; font-weight:600; letter-spacing:.1em;
    text-transform:uppercase; color:#6b7280; margin-bottom:.2rem;
  }

  .settings-row {
    display:flex; justify-content:space-between; align-items:center;
    gap:.5rem;
  }
  .settings-label { font-size:.85rem; color:#d1d5db; }

  .toggle {
    position:relative; width:42px; height:24px; cursor:pointer;
  }
  .toggle input { opacity:0; width:0; height:0; }
  .toggle-slider {
    position:absolute; inset:0;
    background:#374151; border-radius:12px; transition:.3s;
  }
  .toggle-slider::before {
    content:''; position:absolute;
    width:18px; height:18px; left:3px; top:3px;
    background:white; border-radius:50%; transition:.3s;
  }
  .toggle input:checked + .toggle-slider { background:var(--blue); }
  .toggle input:checked + .toggle-slider::before { transform:translateX(18px); }

  select.settings-select {
    background:#1f2937; border:1px solid #374151; color:var(--text);
    padding:.3rem .6rem; border-radius:6px; font-size:.8rem; cursor:pointer;
  }

  /* ── Analytics link (nascosto) ───────────────────────── */
  #analytics-hint {
    position:fixed; bottom:1.5rem; left:1.5rem; z-index:1000;
    font-size:.65rem; color:#1f2937; cursor:pointer;
    transition:color .3s; user-select:none;
  }
  #analytics-hint:hover { color:#374151; }

  /* ── Viewers counter ─────────────────────────────────── */
  #viewers-badge {
    position:fixed; top:1.2rem; right:1.5rem; z-index:1000;
    background:rgba(17,24,39,.8); border:1px solid #374151;
    border-radius:20px; padding:.35rem .9rem;
    font-size:.75rem; color:#9ca3af;
    display:flex; align-items:center; gap:.5rem;
    backdrop-filter:blur(8px);
  }
  .viewers-dot {
    width:7px; height:7px; background:#22c55e; border-radius:50%;
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }

  /* ── QR Section ──────────────────────────────────────── */
  #qr-section {
    height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, #0d1117 0%, var(--bg) 70%);
    position:relative;
  }

  .qr-eyebrow {
    font-size:.8rem; letter-spacing:.2em; text-transform:uppercase;
    color:#6b7280; margin-bottom:2rem;
  }

  #qr-container {
    background:white; padding:16px; border-radius:12px;
    box-shadow:0 0 60px rgba(56,189,248,.2);
    margin-bottom:2rem;
  }

  .qr-url {
    font-size:1rem; color:var(--blue); font-weight:600;
    letter-spacing:.02em; margin-bottom:.5rem; text-align:center;
  }

  .qr-sub {
    font-size:.8rem; color:#6b7280; text-align:center;
    margin-bottom:2rem;
  }


</style>
</head>
<body>

<!-- Heart overlay -->
<div id="heart-overlay"></div>

<!-- Viewers badge -->
<div id="viewers-badge">
  <div class="viewers-dot"></div>
  <span id="viewers-count">0</span> connessi
</div>

<!-- Settings button -->
<div id="settings-btn" onclick="toggleSettings()" title="Impostazioni">⚙️</div>
<div id="settings-panel">
  <div class="settings-title">Impostazioni Cuori</div>

  <div class="settings-row">
    <span class="settings-label">Cuori attivi</span>
    <label class="toggle">
      <input type="checkbox" id="hearts-enabled" checked onchange="saveSettings()">
      <span class="toggle-slider"></span>
    </label>
  </div>

  <div class="settings-row">
    <span class="settings-label">Intervallo minimo</span>
    <select class="settings-select" id="heart-interval" onchange="saveSettings()">
      <option value="0">Nessuno</option>
      <option value="5000">5 sec</option>
      <option value="10000" selected>10 sec</option>
      <option value="30000">30 sec</option>
      <option value="60000">1 min</option>
    </select>
  </div>

  <div class="settings-row">
    <span class="settings-label">Volume suono</span>
    <select class="settings-select" id="heart-volume" onchange="saveSettings()">
      <option value="0">Muto</option>
      <option value="0.15">Basso</option>
      <option value="0.3" selected>Medio</option>
      <option value="0.6">Alto</option>
    </select>
  </div>
</div>

<!-- Analytics hint (nascosto) -->
<div id="analytics-hint" onclick="goToAnalytics()" title="⬡">◆</div>

<!-- QR Section -->
<div id="qr-section">
  <div class="qr-eyebrow" id="qr-eyebrow">Scansiona con il telefono per partecipare</div>
  <div id="qr-container"></div>
  <div class="qr-url" id="reel-url">Caricamento…</div>
  <div class="qr-sub" id="qr-sub">Il tuo telefono diventerà parte dell'esperimento.</div>
</div>

<!-- QR code library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Config -->
<script src="config.js"></script>

<script>
'use strict';

const CFG = window.APP_CONFIG;
const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey);

// ── QR Code ──────────────────────────────────────────────────
const reelUrl = CFG.siteUrl.replace(/\/$/, '') + '/reel.html';
document.getElementById('reel-url').textContent = reelUrl;
new QRCode(document.getElementById('qr-container'), {
  text: reelUrl,
  width: 240, height: 240,
  colorDark: '#000', colorLight: '#fff',
  correctLevel: QRCode.CorrectLevel.M,
});

// ── Testi personalizzabili dello schermo QR ────────────────────
// Letti da site_config (gestita da admin.html); il testo già nell'HTML
// resta come fallback se il fetch fallisce o la riga non esiste ancora.
async function loadSiteConfig() {
  const { data, error } = await sb.from('site_config').select('*').eq('id', 1).maybeSingle();
  if (error || !data) return;
  if (data.qr_eyebrow)  document.getElementById('qr-eyebrow').textContent = data.qr_eyebrow;
  if (data.qr_subtitle) document.getElementById('qr-sub').textContent = data.qr_subtitle;
  if (data.page_title)  document.title = data.page_title;
}
loadSiteConfig();

// ── Settings ─────────────────────────────────────────────────
let heartsEnabled = true;
let heartInterval = 10000;
let heartVolume = 0.3;
let lastHeartTime = 0;

function toggleSettings() {
  document.getElementById('settings-panel').classList.toggle('open');
}

function saveSettings() {
  heartsEnabled = document.getElementById('hearts-enabled').checked;
  heartInterval = parseInt(document.getElementById('heart-interval').value);
  heartVolume   = parseFloat(document.getElementById('heart-volume').value);
}

// Close panel when clicking outside
document.addEventListener('click', (e) => {
  if (!e.target.closest('#settings-btn') && !e.target.closest('#settings-panel')) {
    document.getElementById('settings-panel').classList.remove('open');
  }
});

// ── Analytics link ────────────────────────────────────────────
function goToAnalytics() {
  window.open(`analytics.html#${CFG.analyticsToken}`, '_blank');
}

// ── Heart animation ───────────────────────────────────────────
const HEART_EMOJIS = ['❤️','🧡','💛','💚','💙','💜','🩷','🤍'];

function showHeartAnimation(count = 1) {
  if (!heartsEnabled) return;
  const now = Date.now();
  if (heartInterval > 0 && now - lastHeartTime < heartInterval) return;
  lastHeartTime = now;

  const overlay = document.getElementById('heart-overlay');
  const burst = Math.min(count, 8);
  for (let i = 0; i < burst; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'heart-particle';
      el.textContent = HEART_EMOJIS[Math.floor(Math.random() * HEART_EMOJIS.length)];
      el.style.left = (15 + Math.random() * 70) + '%';
      el.style.fontSize = (1.5 + Math.random() * 2) + 'rem';
      el.style.animationDuration = (2 + Math.random() * 1.5) + 's';
      overlay.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }, i * 120);
  }
  playHeartSound();
}

// ── Heart sound (Web Audio API) ───────────────────────────────
let audioCtx = null;

function playHeartSound() {
  if (heartVolume === 0) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(660, audioCtx.currentTime + 0.08);
    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);

    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(heartVolume, audioCtx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);

    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.4);
  } catch(e) {}
}

// ── Realtime subscription ─────────────────────────────────────
// Il contatore "connessi" usa la Presence di Supabase Realtime, non un
// conteggio di INSERT su sessions: quel conteggio saliva soltanto (nuova
// sessione = +1) e non si accorgeva mai di chi chiudeva il reel, quindi
// restava "connessi" gente che se ne era andata da ore. Ogni reel.html
// aperto si registra sullo stesso canale ('live') con la propria
// SESSION_ID; quando la sua connessione WebSocket cade (tab chiusa,
// telefono spento, rete persa) Supabase lo rimuove da solo.
const rtChannel = sb
  .channel('live')
  .on('postgres_changes', {
    event: 'INSERT', schema: 'public', table: 'hearts'
  }, (payload) => {
    console.log('[Realtime] ❤️ heart ricevuto:', payload.new);
    showHeartAnimation(3);
  })
  .on('presence', { event: 'sync' }, () => {
    const state = rtChannel.presenceState();
    document.getElementById('viewers-count').textContent = Object.keys(state).length;
  })
  .subscribe((status, err) => {
    console.log('[Realtime] stato canale:', status, err || '');
    const dot = document.querySelector('.viewers-dot');
    if (status === 'SUBSCRIBED') {
      dot.style.background = '#22c55e'; // verde = connesso
      console.log('[Realtime] ✅ connesso, in ascolto su hearts e presenza spettatori');
    } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
      dot.style.background = '#ef4444'; // rosso = errore
      console.error('[Realtime] ❌ errore connessione:', status, err);
    } else {
      dot.style.background = '#fbbf24'; // giallo = in attesa
    }
  });

// Inizializza AudioContext al primo click (requisito browser)
document.addEventListener('click', () => {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}, { once: true });
</script>
</body>
</html>
