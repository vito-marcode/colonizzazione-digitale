<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Colonizzazione Digitale</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;600;700;900&display=swap');

  :root {
    --bg:#05070a; --surface:#0d1117; --card:#111827;
    --blue:#38bdf8; --red:#ef4444; --green:#22c55e;
    --yellow:#fbbf24; --purple:#a78bfa;
    --text:#f3f4f6; --muted:#6b7280; --border:#1f2937;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }

  /* ── Auth wall ────────────────────────────────────────── */
  #auth-wall {
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1rem;
  }
  .auth-title { font-size:3rem; font-weight:900; color:var(--purple); }
  .auth-sub   { color:var(--muted); font-size:1rem; }

  /* ── Layout ───────────────────────────────────────────── */
  #admin-panel { display:none; padding:2rem; max-width:900px; margin:0 auto; }
  #admin-panel.visible { display:block; }

  header {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:2rem; padding-bottom:1.5rem;
    border-bottom:1px solid var(--border);
  }
  .header-title { font-size:1.8rem; font-weight:900; }
  .header-title span { color:var(--purple); }

  .section {
    background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:1.5rem; margin-bottom:2rem;
  }
  .section-title {
    font-size:.7rem; letter-spacing:.15em; text-transform:uppercase;
    color:var(--muted); margin-bottom:1.2rem;
  }

  label { display:block; font-size:.8rem; color:var(--muted); margin-bottom:.3rem; margin-top:.9rem; }
  label:first-child { margin-top:0; }
  input[type="text"], input[type="url"], textarea, select {
    width:100%; background:var(--surface); border:1px solid var(--border);
    color:var(--text); padding:.6rem .8rem; border-radius:8px;
    font-size:.9rem; font-family:inherit;
  }
  textarea { resize:vertical; min-height:70px; }

  .btn {
    background:var(--blue); color:#000; border:none;
    padding:.6rem 1.4rem; border-radius:8px; font-weight:700;
    cursor:pointer; font-size:.85rem; margin-top:1.2rem; margin-right:.5rem;
  }
  .btn-secondary { background:transparent; color:var(--text); border:1px solid var(--border); }
  .btn-danger { background:var(--red); color:#fff; }
  .btn-sm { padding:.3rem .6rem; font-size:.7rem; margin-top:0; }

  /* ── Slides list ──────────────────────────────────────── */
  .slide-row {
    display:flex; flex-wrap:wrap; align-items:center; gap:.6rem .8rem;
    background:var(--surface); border:1px solid var(--border);
    border-radius:8px; padding:.7rem 1rem; margin-bottom:.6rem;
  }
  .slide-thumb {
    width:40px; height:70px; object-fit:cover; border-radius:4px;
    background:#000; flex-shrink:0;
  }
  .slide-thumb-placeholder {
    width:40px; height:70px; border-radius:4px; background:#000;
    display:flex; align-items:center; justify-content:center;
    font-size:1.2rem; flex-shrink:0;
  }
  .slide-badge {
    font-size:.6rem; text-transform:uppercase; letter-spacing:.05em;
    padding:.15rem .5rem; border-radius:20px; background:rgba(167,139,250,.15);
    color:var(--purple); flex-shrink:0;
  }
  /* min-width:80px invece di flex:1 puro: lascia che l'etichetta vada a capo
     su una riga tutta sua quando lo spazio non basta, invece di schiacciarsi
     a oltranza e spingere le azioni fuori dalla card (causa di overlap/scroll
     orizzontale sugli schermi stretti). */
  .slide-label { flex:1 1 80px; min-width:80px; font-size:.85rem; word-break:break-word; }
  .slide-actions { display:flex; flex-wrap:wrap; gap:.3rem; flex-shrink:0; margin-left:auto; }
  .slide-actions button {
    background:var(--card); border:1px solid var(--border); color:var(--text);
    padding:.3rem .6rem; border-radius:6px; cursor:pointer; font-size:.75rem;
  }
  .slide-actions button:hover { border-color:var(--blue); }

  .empty { color:var(--muted); font-size:.85rem; text-align:center; padding:1.5rem; }

  /* ── Modal form ───────────────────────────────────────── */
  #slide-form-modal {
    display:none; position:fixed; inset:0; z-index:1000;
    background:rgba(0,0,0,.7);
    align-items:center; justify-content:center;
  }
  #slide-form-modal.visible { display:flex; }
  .modal-box {
    background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:1.5rem; width:90%; max-width:480px;
    max-height:85vh; overflow-y:auto;
  }

  .msg { font-size:.8rem; margin-top:.8rem; }
  .msg-error { color:var(--red); }
  .msg-ok { color:var(--green); }

  /* ── Upload file (verso il bucket S3 Cubbit) ─────────────── */
  .upload-row { display:flex; align-items:center; gap:.6rem; margin-top:.5rem; flex-wrap:wrap; }
  .upload-btn {
    display:inline-block; background:transparent; border:1px solid var(--border);
    color:var(--text); padding:.4rem .8rem; border-radius:6px;
    font-size:.75rem; cursor:pointer;
  }
  .upload-btn:hover { border-color:var(--blue); }
  .upload-btn input[type="file"] { display:none; }
  .upload-status { font-size:.75rem; color:var(--muted); }
  .upload-status.msg-ok { color:var(--green); }
  .upload-status.msg-error { color:var(--red); }

  /* ── Selettore colore (pallino + palette preimpostata) ───── */
  .accent-picker-row { display:flex; align-items:center; gap:.5rem; position:relative; }
  .accent-picker-row input[type="text"] { flex:1; }
  .accent-swatch {
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    border:2px solid var(--border); cursor:pointer; padding:0;
  }
  .accent-popover {
    /* Si apre VERSO L'ALTO (bottom, non top): il campo "Colore testo" è
       l'ultimo del form prima dei pulsanti Salva/Anteprima/Annulla — aprendo
       verso il basso la palette finirebbe quasi sopra quei pulsanti. */
    display:none; position:absolute; bottom:42px; right:0; z-index:10;
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:.6rem; width:168px; max-width:70vw; flex-wrap:wrap; gap:.4rem;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  .accent-popover.visible { display:flex; }
  .accent-swatch-option {
    width:26px; height:26px; border-radius:50%; cursor:pointer;
    border:1px solid var(--border); padding:0;
  }
  .accent-swatch-option:hover { border-color:var(--blue); }

  /* ── Anteprima mobile ─────────────────────────────────────── */
  #preview-modal {
    display:none; position:fixed; inset:0; z-index:2000;
    background:rgba(0,0,0,.85); align-items:center; justify-content:center;
    flex-direction:column; gap:1rem;
  }
  #preview-modal.visible { display:flex; }
  .phone-frame {
    /* min(280px, 80vw) invece di una larghezza fissa: non deborda mai dalla
       finestra su un telefono stretto. aspect-ratio al posto di un'altezza
       fissa, per restare proporzionato qualunque sia la larghezza risolta. */
    width:min(280px, 80vw); aspect-ratio:9/19.5;
    border-radius:36px; overflow:hidden;
    border:8px solid #222; background:#000; position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  .phone-frame .slide { position:absolute; inset:0; height:100%; }

  /* Copie minime del rendering di reel.html, per un'anteprima fedele */
  .phone-frame .slide-image { width:100%; height:100%; object-fit:cover; object-position:center; display:block; }
  .phone-frame .slide-text-bg { position:relative; background:#000; width:100%; height:100%; }
  .phone-frame .slide-bg-image { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  .phone-frame .slide-text-bg::after {
    content:''; position:absolute; inset:0; z-index:1;
    background:linear-gradient(to bottom, rgba(0,0,0,.35), rgba(0,0,0,.55));
  }
  .phone-frame .slide-text {
    position:relative; z-index:2; width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:1.6rem 1.2rem; text-align:center; font-family:'Inter',sans-serif;
  }
  .phone-frame .slide-eyebrow { font-size:.6rem; letter-spacing:.2em; text-transform:uppercase; margin-bottom:.9rem; opacity:.9; }
  .phone-frame .slide-title { font-size:1.5rem; font-weight:900; line-height:1.15; margin-bottom:1rem; white-space:pre-line; }
  .phone-frame .slide-body { font-size:.85rem; line-height:1.5; opacity:.95; max-width:220px; }
  .phone-frame .slide-footer {
    position:absolute; bottom:1.2rem; left:0; right:0; z-index:2;
    text-align:center; font-size:.6rem; opacity:.6; font-style:italic; padding:0 1.5rem;
  }
  .phone-frame .preview-empty {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:.8rem; text-align:center; padding:2rem;
  }

  /* ── Responsive: telefono ─────────────────────────────────── */
  @media (max-width: 480px) {
    #admin-panel { padding:1rem; }
    .section { padding:1rem; }
    .header-title { font-size:1.3rem; }
    .modal-box { width:94%; padding:1rem; }
    .btn { padding:.6rem 1rem; margin-right:.3rem; }
  }
</style>
</head>
<body>

<!-- Auth wall -->
<div id="auth-wall">
  <div class="auth-title">🛠️</div>
  <div style="font-size:1.5rem;font-weight:900">Accesso Admin</div>
  <div class="auth-sub">Inserisci il codice amministratore</div>
  <input type="password" id="auth-input" placeholder="codice..." autocomplete="off"
    style="background:#111827;border:1px solid #374151;color:white;padding:.6rem 1rem;border-radius:8px;font-size:1rem;text-align:center;width:220px;"
    onkeydown="if(event.key==='Enter')checkAuth()">
  <button onclick="checkAuth()"
    style="background:#a78bfa;color:#000;border:none;padding:.6rem 2rem;border-radius:8px;font-weight:700;cursor:pointer;font-size:.9rem;">
    Accedi
  </button>
  <div id="auth-err" style="color:#ef4444;font-size:.8rem;display:none;">Codice errato</div>
</div>

<!-- Admin panel -->
<div id="admin-panel">

  <header>
    <div class="header-title">Admin — <span>Colonizzazione Digitale</span></div>
  </header>

  <!-- Testi schermo QR -->
  <section class="section">
    <div class="section-title">Testi schermo QR (index.html)</div>
    <label>Eyebrow (sopra il QR)</label>
    <input type="text" id="cfg-eyebrow" placeholder="Scansiona con il telefono per partecipare">
    <label>Sottotitolo (sotto il QR)</label>
    <input type="text" id="cfg-subtitle" placeholder="Il tuo telefono diventerà parte dell'esperimento.">
    <label>Titolo pagina (tab del browser)</label>
    <input type="text" id="cfg-title" placeholder="Colonizzazione Digitale — Schermo Principale">
    <button class="btn" onclick="saveSiteConfig()">Salva testi</button>
    <span id="site-config-msg" class="msg"></span>
  </section>

  <!-- Slide del reel -->
  <section class="section">
    <div class="section-title">Slide del reel (reel.html)</div>
    <div id="slides-list"></div>
    <button class="btn" onclick="openSlideForm()">+ Nuova slide</button>
  </section>

</div>

<!-- Form slide (modale) -->
<div id="slide-form-modal">
  <div class="modal-box">
    <div class="section-title" id="slide-form-title">Nuova slide</div>

    <label>Tipo</label>
    <select id="slide-type" onchange="onTypeChange()">
      <option value="image">Immagine</option>
      <option value="image_text">Immagine con testo sovrapposto</option>
      <option value="video">Video</option>
    </select>

    <label>Etichetta (per la dashboard)</label>
    <input type="text" id="slide-label" placeholder="es. Snowden">

    <div id="fields-image">
      <label>URL immagine</label>
      <input type="url" id="slide-image-url" placeholder="https://.../immagine.jpg">
      <div class="upload-row">
        <label class="upload-btn">📤 Carica file<input type="file" accept="image/*" onchange="handleFileUpload(event,'slide-image-url','image')"></label>
        <span class="upload-status" id="upload-status-slide-image-url"></span>
      </div>
    </div>

    <div id="fields-image-text" style="display:none">
      <label>URL immagine di sfondo</label>
      <input type="url" id="slide-image-url-2" placeholder="https://.../sfondo.jpg">
      <div class="upload-row">
        <label class="upload-btn">📤 Carica file<input type="file" accept="image/*" onchange="handleFileUpload(event,'slide-image-url-2','image')"></label>
        <span class="upload-status" id="upload-status-slide-image-url-2"></span>
      </div>
      <label>Eyebrow</label>
      <input type="text" id="slide-eyebrow" placeholder="es. EDWARD SNOWDEN">
      <label>Titolo</label>
      <input type="text" id="slide-title" placeholder="Titolo della slide">
      <label>Corpo</label>
      <textarea id="slide-body" placeholder="Testo della citazione..."></textarea>
      <label>Footer</label>
      <input type="text" id="slide-footer" placeholder="es. fonte, nota">
      <label>Colore testo</label>
      <div class="accent-picker-row">
        <input type="text" id="slide-accent" placeholder="#ffffff" oninput="updateAccentSwatch()">
        <button type="button" class="accent-swatch" id="accent-swatch" onclick="toggleAccentPicker()" title="Scegli colore"></button>
        <div class="accent-popover" id="accent-popover"></div>
      </div>
    </div>

    <div id="fields-video" style="display:none">
      <label>URL video (.mp4 pubblico)</label>
      <input type="url" id="slide-video-url" placeholder="https://.../video.mp4">
      <div class="upload-row">
        <label class="upload-btn">📤 Carica file<input type="file" accept="video/*" onchange="handleFileUpload(event,'slide-video-url','video')"></label>
        <span class="upload-status" id="upload-status-slide-video-url"></span>
      </div>
    </div>

    <button class="btn" onclick="saveSlide()">Salva slide</button>
    <button class="btn btn-secondary" onclick="openPreview()">👁 Anteprima mobile</button>
    <button class="btn btn-secondary" onclick="closeSlideForm()">Annulla</button>
    <div id="slide-form-msg" class="msg"></div>
  </div>
</div>

<!-- Anteprima mobile -->
<div id="preview-modal">
  <div class="phone-frame"><div id="preview-slide" class="slide"></div></div>
  <button class="btn btn-secondary" onclick="closePreview()">Chiudi anteprima</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
'use strict';

const CFG = window.APP_CONFIG;
const sb  = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey);

// Anteprime in miniatura: passano dallo stesso proxy di resize/compressione
// usato da reel.html (wsrv.nl, gratuito, senza API key), ma a una risoluzione
// molto più piccola visto che qui è solo una miniatura 40×70.
function optimizedImageUrl(url, { width = 100, quality = 70 } = {}) {
  if (!url) return url;
  let absolute;
  try {
    absolute = new URL(url, CFG.siteUrl).href;
  } catch (e) {
    return url;
  }
  return `https://wsrv.nl/?url=${encodeURIComponent(absolute)}&w=${width}&q=${quality}&output=webp&we=1`;
}

// Stessa logica di reel.html (duplicata qui: niente modulo condiviso in un
// progetto senza build step): un'ombra/contorno a contrasto col colore
// scelto, per restare leggibile su uno sfondo foto non controllato.
function contrastTextShadow(hexColor) {
  const hex = (hexColor || '#ffffff').replace('#', '');
  const full = hex.length === 3 ? hex.split('').map(c => c + c).join('') : hex;
  const r = parseInt(full.substring(0, 2), 16);
  const g = parseInt(full.substring(2, 4), 16);
  const b = parseInt(full.substring(4, 6), 16);
  const brightness = (Number.isFinite(r) && Number.isFinite(g) && Number.isFinite(b))
    ? (r * 299 + g * 587 + b * 114) / 1000
    : 255;
  const shadow = brightness > 150 ? '0,0,0' : '255,255,255';
  return `0 0 3px rgba(${shadow},.9), 0 0 6px rgba(${shadow},.7), 1px 1px 2px rgba(${shadow},.9)`;
}

function slideTextStyle(accent) {
  return `color:${accent || '#fff'};text-shadow:${contrastTextShadow(accent)}`;
}

// ── Auth ──────────────────────────────────────────────────────
function unlockAdmin() {
  document.getElementById('auth-wall').style.display = 'none';
  document.getElementById('admin-panel').classList.add('visible');
  loadSiteConfig();
  loadSlides();
}

function checkAuth() {
  const input = document.getElementById('auth-input').value.trim();
  if (input === CFG.adminToken || window.location.hash.slice(1) === CFG.adminToken) {
    unlockAdmin();
  } else {
    document.getElementById('auth-err').style.display = 'block';
  }
}

// Nessun link pubblico porta qui: raggiungibile solo conoscendo l'URL diretto
// con #<adminToken>, come analytics.html ma senza un simbolo cliccabile.
if (window.location.hash.slice(1) === CFG.adminToken) {
  unlockAdmin();
}

// ── Testi schermo QR (site_config, riga singola id=1) ──────────
async function loadSiteConfig() {
  const { data, error } = await sb.from('site_config').select('*').eq('id', 1).maybeSingle();
  if (error || !data) return;
  document.getElementById('cfg-eyebrow').value  = data.qr_eyebrow  || '';
  document.getElementById('cfg-subtitle').value = data.qr_subtitle || '';
  document.getElementById('cfg-title').value    = data.page_title || '';
}

async function saveSiteConfig() {
  const msg = document.getElementById('site-config-msg');
  msg.textContent = '';
  const payload = {
    id: 1,
    qr_eyebrow:  document.getElementById('cfg-eyebrow').value.trim() || null,
    qr_subtitle: document.getElementById('cfg-subtitle').value.trim() || null,
    page_title:  document.getElementById('cfg-title').value.trim() || null,
  };
  const { error } = await sb.from('site_config').upsert(payload, { onConflict: 'id' });
  if (error) {
    msg.textContent = 'Errore: ' + error.message;
    msg.className = 'msg msg-error';
    return;
  }
  msg.textContent = 'Salvato ✓';
  msg.className = 'msg msg-ok';
}

// ── Slide del reel (tabella slides) ────────────────────────────
let slidesCache = [];
let editingSlideId = null;

const TYPE_LABELS = { image: 'Immagine', image_text: 'Immagine+testo', video: 'Video' };

async function loadSlides() {
  const { data, error } = await sb.from('slides').select('*').order('position', { ascending: true });
  if (error) { console.error('[Admin] fetch slides fallito:', error.message); return; }
  slidesCache = data || [];
  renderSlidesList();
}

function renderSlidesList() {
  const el = document.getElementById('slides-list');
  if (slidesCache.length === 0) {
    el.innerHTML = '<div class="empty">Nessuna slide configurata. Il reel non mostrerà nulla finché non ne aggiungi una.</div>';
    return;
  }
  el.innerHTML = slidesCache.map((s, i) => {
    let thumb;
    if (s.type === 'video') {
      thumb = '<div class="slide-thumb-placeholder">🎬</div>';
    } else if (s.image_url) {
      thumb = `<img class="slide-thumb" src="${esc(optimizedImageUrl(s.image_url))}" alt="">`;
    } else {
      thumb = '<div class="slide-thumb-placeholder">🖼️</div>';
    }
    return `
      <div class="slide-row">
        ${thumb}
        <span class="slide-badge">${TYPE_LABELS[s.type] || s.type}</span>
        <span class="slide-label">${esc(s.label || '(senza etichetta)')}</span>
        <div class="slide-actions">
          <button onclick="moveSlide(${s.id},'up')" ${i === 0 ? 'disabled' : ''} title="Sposta su">▲</button>
          <button onclick="moveSlide(${s.id},'down')" ${i === slidesCache.length - 1 ? 'disabled' : ''} title="Sposta giù">▼</button>
          <button onclick="previewSlideFromList(${s.id})" title="Anteprima mobile">👁</button>
          <button onclick="editSlide(${s.id})" title="Modifica">✎</button>
          <button onclick="deleteSlide(${s.id})" title="Elimina">🗑</button>
        </div>
      </div>`;
  }).join('');
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function onTypeChange() {
  const type = document.getElementById('slide-type').value;
  document.getElementById('fields-image').style.display      = type === 'image' ? 'block' : 'none';
  document.getElementById('fields-image-text').style.display = type === 'image_text' ? 'block' : 'none';
  document.getElementById('fields-video').style.display      = type === 'video' ? 'block' : 'none';
}

// ── Selettore colore (pallino + palette preimpostata) ──────────
const ACCENT_PRESETS = ['#ffffff', '#000000', '#38bdf8', '#ef4444', '#fbbf24', '#22c55e', '#a78bfa', '#f3f4f6'];

function renderAccentPicker() {
  document.getElementById('accent-popover').innerHTML = ACCENT_PRESETS.map(c =>
    `<button type="button" class="accent-swatch-option" style="background:${c}" title="${c}" onclick="selectAccent('${c}')"></button>`
  ).join('');
}

function updateAccentSwatch() {
  const val = document.getElementById('slide-accent').value.trim() || '#ffffff';
  document.getElementById('accent-swatch').style.background = val;
}

function toggleAccentPicker() {
  document.getElementById('accent-popover').classList.toggle('visible');
}

function selectAccent(color) {
  document.getElementById('slide-accent').value = color;
  updateAccentSwatch();
  document.getElementById('accent-popover').classList.remove('visible');
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.accent-picker-row')) {
    document.getElementById('accent-popover').classList.remove('visible');
  }
});
renderAccentPicker();

function openSlideForm() {
  editingSlideId = null;
  document.getElementById('slide-form-title').textContent = 'Nuova slide';
  document.getElementById('slide-type').value = 'image';
  ['slide-label','slide-image-url','slide-image-url-2','slide-eyebrow','slide-title','slide-body','slide-footer','slide-accent','slide-video-url']
    .forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('slide-form-msg').textContent = '';
  onTypeChange();
  updateAccentSwatch();
  document.getElementById('slide-form-modal').classList.add('visible');
}

function editSlide(id) {
  const s = slidesCache.find(x => x.id === id);
  if (!s) return;
  editingSlideId = id;
  document.getElementById('slide-form-title').textContent = 'Modifica slide';
  document.getElementById('slide-type').value = s.type;
  document.getElementById('slide-label').value = s.label || '';
  document.getElementById('slide-image-url').value = s.type === 'image' ? (s.image_url || '') : '';
  document.getElementById('slide-image-url-2').value = s.type === 'image_text' ? (s.image_url || '') : '';
  document.getElementById('slide-eyebrow').value = s.eyebrow || '';
  document.getElementById('slide-title').value = s.title || '';
  document.getElementById('slide-body').value = s.body || '';
  document.getElementById('slide-footer').value = s.footer || '';
  document.getElementById('slide-accent').value = s.accent || '';
  document.getElementById('slide-video-url').value = s.video_url || '';
  document.getElementById('slide-form-msg').textContent = '';
  onTypeChange();
  updateAccentSwatch();
  document.getElementById('slide-form-modal').classList.add('visible');
}

function closeSlideForm() {
  document.getElementById('slide-form-modal').classList.remove('visible');
}

// ── Upload file su Cubbit (bucket S3 proprio) ──────────────────
// La secret key S3 non tocca mai il browser: una Netlify Function la
// conosce (variabile d'ambiente lato server) e genera un URL di upload
// firmato e temporaneo; il browser carica il file DIRETTAMENTE su Cubbit
// con quell'URL, i byte non passano mai dalla function.
const UPLOAD_LIMITS = { image: 10 * 1024 * 1024, video: 150 * 1024 * 1024 }; // 10MB / 150MB

async function handleFileUpload(event, targetInputId, kind) {
  const input = event.target;
  const file = input.files[0];
  input.value = ''; // permette di ricaricare lo stesso file in futuro
  if (!file) return;

  const statusEl = document.getElementById('upload-status-' + targetInputId);
  const setStatus = (text, cls) => { statusEl.textContent = text; statusEl.className = 'upload-status' + (cls ? ' ' + cls : ''); };

  const limit = UPLOAD_LIMITS[kind];
  if (file.size > limit) {
    setStatus(`File troppo grande (max ${Math.round(limit / 1024 / 1024)}MB)`, 'msg-error');
    return;
  }
  if (!file.type.startsWith(kind + '/')) {
    setStatus(kind === 'image' ? 'Il file scelto non è un\'immagine' : 'Il file scelto non è un video', 'msg-error');
    return;
  }

  setStatus('Caricamento in corso…');
  try {
    const res = await fetch('/.netlify/functions/get-upload-url', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ adminToken: CFG.adminToken, filename: file.name, contentType: file.type }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `errore ${res.status}`);
    }
    const { uploadUrl, publicUrl } = await res.json();

    const putRes = await fetch(uploadUrl, { method: 'PUT', headers: { 'Content-Type': file.type }, body: file });
    if (!putRes.ok) throw new Error(`upload fallito (${putRes.status})`);

    document.getElementById(targetInputId).value = publicUrl;
    setStatus('Caricato ✓', 'msg-ok');
  } catch (err) {
    setStatus('Errore: ' + err.message, 'msg-error');
  }
}

// Lettura dei campi del form, condivisa tra salvataggio e anteprima — così
// non possono disallinearsi tra loro.
function readSlideForm() {
  const type = document.getElementById('slide-type').value;
  const payload = { type, label: document.getElementById('slide-label').value.trim() || null };

  if (type === 'image') {
    payload.image_url = document.getElementById('slide-image-url').value.trim() || null;
  } else if (type === 'image_text') {
    payload.image_url = document.getElementById('slide-image-url-2').value.trim() || null;
    payload.eyebrow = document.getElementById('slide-eyebrow').value.trim() || null;
    payload.title   = document.getElementById('slide-title').value.trim() || null;
    payload.body    = document.getElementById('slide-body').value.trim() || null;
    payload.footer  = document.getElementById('slide-footer').value.trim() || null;
    payload.accent  = document.getElementById('slide-accent').value.trim() || null;
  } else if (type === 'video') {
    payload.video_url = document.getElementById('slide-video-url').value.trim() || null;
  }
  return payload;
}

async function saveSlide() {
  const msg = document.getElementById('slide-form-msg');
  msg.textContent = '';
  const payload = readSlideForm();

  if (editingSlideId) {
    const { error } = await sb.from('slides').update(payload).eq('id', editingSlideId);
    if (error) { msg.textContent = 'Errore: ' + error.message; msg.className = 'msg msg-error'; return; }
  } else {
    payload.position = slidesCache.length; // append in coda
    const { error } = await sb.from('slides').insert(payload);
    if (error) { msg.textContent = 'Errore: ' + error.message; msg.className = 'msg msg-error'; return; }
  }
  closeSlideForm();
  await loadSlides();
}

async function deleteSlide(id) {
  if (!confirm('Eliminare questa slide? Le visualizzazioni/i cuori storici restano nel database, solo senza più il collegamento diretto a questa slide.')) return;
  const { error } = await sb.from('slides').delete().eq('id', id);
  if (error) { alert('Errore eliminazione: ' + error.message); return; }
  await repackPositions();
  await loadSlides();
}

// Ripacchetta le posizioni a 0..N-1 contigue dopo una delete: analytics.html
// fa fallback su image_index===slide.position per i dati storici, quindi un
// "buco" nelle posizioni spezzerebbe quell'attribuzione.
async function repackPositions() {
  const { data, error } = await sb.from('slides').select('id').order('position', { ascending: true });
  if (error || !data) return;
  await Promise.all(data.map((row, i) => sb.from('slides').update({ position: i }).eq('id', row.id)));
}

// Riordino: scambia "position" con la riga adiacente (niente drag&drop).
async function moveSlide(id, dir) {
  const idx = slidesCache.findIndex(s => s.id === id);
  const swapIdx = dir === 'up' ? idx - 1 : idx + 1;
  if (swapIdx < 0 || swapIdx >= slidesCache.length) return;
  const a = slidesCache[idx], b = slidesCache[swapIdx];
  const [{ error: e1 }, { error: e2 }] = await Promise.all([
    sb.from('slides').update({ position: b.position }).eq('id', a.id),
    sb.from('slides').update({ position: a.position }).eq('id', b.id),
  ]);
  if (e1 || e2) { alert('Errore riordino: ' + (e1 || e2).message); return; }
  await loadSlides();
}

// ── Anteprima mobile ────────────────────────────────────────────
// Renderizza, dentro una cornice a forma di telefono, lo stesso HTML/CSS
// che reel.html userebbe per questa slide — stessa logica di renderSlides()
// in reel.html. Senza argomenti legge i valori attuali del form (anche non
// ancora salvati, usato dal pulsante dentro il form); da una slide già
// salvata nella lista, si passa direttamente la riga (vedi previewSlideFromList).
function openPreview(slideOverride) {
  const slide = slideOverride || readSlideForm();
  const el = document.getElementById('preview-slide');
  el.className = 'slide';
  el.innerHTML = '';

  if (slide.type === 'image') {
    if (slide.image_url) {
      el.innerHTML = `<img class="slide-image" src="${esc(optimizedImageUrl(slide.image_url, { width: 560 }))}" alt="">`;
    } else {
      el.innerHTML = '<div class="preview-empty">Inserisci un URL immagine per vedere l\'anteprima.</div>';
    }

  } else if (slide.type === 'video') {
    if (slide.video_url) {
      el.innerHTML = `<video class="slide-image" src="${esc(slide.video_url)}" autoplay muted loop playsinline webkit-playsinline="true"></video>`;
    } else {
      el.innerHTML = '<div class="preview-empty">Inserisci un URL video per vedere l\'anteprima.</div>';
    }

  } else if (slide.type === 'image_text') {
    el.classList.add('slide-text-bg');
    const style = slideTextStyle(slide.accent);
    el.innerHTML = `
      ${slide.image_url ? `<img class="slide-bg-image" src="${esc(optimizedImageUrl(slide.image_url, { width: 560 }))}" alt="">` : ''}
      <div class="slide-text">
        ${slide.eyebrow ? `<div class="slide-eyebrow" style="${style}">${esc(slide.eyebrow)}</div>` : ''}
        ${slide.title ? `<div class="slide-title" style="${style}">${esc(slide.title).replace(/\n/g,'<br>')}</div>` : ''}
        ${slide.body ? `<div class="slide-body" style="${style}">${esc(slide.body)}</div>` : ''}
      </div>
      ${slide.footer ? `<div class="slide-footer" style="${style}">${esc(slide.footer)}</div>` : ''}
    `;
  }

  document.getElementById('preview-modal').classList.add('visible');
}

function closePreview() {
  document.getElementById('preview-modal').classList.remove('visible');
  // Ferma un eventuale video in riproduzione invece di lasciarlo andare in background
  const video = document.querySelector('#preview-slide video');
  if (video) video.pause();
}

// Anteprima diretta dalla lista, senza passare dal form di modifica.
function previewSlideFromList(id) {
  const s = slidesCache.find(x => x.id === id);
  if (s) openPreview(s);
}
</script>
