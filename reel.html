<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Colonizzazione Digitale</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    height:100%; overflow:hidden;
    background:#000; font-family:'Inter',sans-serif;
    touch-action:none; /* gestiamo il touch manualmente */
  }

  /* ── Reel container ──────────────────────────────────── */
  #reel {
    position:fixed; inset:0;
    will-change:transform;
    transition:transform 0.38s cubic-bezier(0.25,0.46,0.45,0.94);
  }

  /* ── Singola slide ───────────────────────────────────── */
  .slide {
    position:absolute; left:0; right:0;
    height:100dvh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    overflow:hidden;
  }

  /* Slide immagine */
  .slide-image {
    width:100%; height:100%;
    object-fit:cover; object-position:center;
    display:block; pointer-events:none; user-select:none;
  }

  /* Slide testuale */
  .slide-text {
    width:100%; height:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:2.5rem 1.8rem;
    text-align:center;
  }

  .slide-eyebrow {
    font-size:.65rem; letter-spacing:.2em; text-transform:uppercase;
    margin-bottom:1.2rem; opacity:.7;
  }

  .slide-title {
    font-size:clamp(2rem,8vw,3rem); font-weight:900; line-height:1.1;
    margin-bottom:1.5rem; white-space:pre-line;
  }

  .slide-body {
    font-size:clamp(.95rem,4vw,1.2rem); line-height:1.6;
    opacity:.85; max-width:320px;
  }

  .slide-footer {
    position:absolute; bottom:2rem; left:0; right:0;
    text-align:center; font-size:.7rem; opacity:.5;
    font-style:italic; padding:0 2rem;
  }

  /* ── Dots indicator ──────────────────────────────────── */
  #dots {
    position:fixed; right:14px; top:50%; transform:translateY(-50%);
    display:flex; flex-direction:column; gap:6px; z-index:100;
  }
  .dot {
    width:4px; height:4px; border-radius:2px;
    background:rgba(255,255,255,.3);
    transition:all .3s; flex-shrink:0;
  }
  .dot.active {
    background:white; height:16px;
  }

  /* ── Heart button ────────────────────────────────────── */
  #heart-btn {
    position:fixed; bottom:2.5rem; right:1.5rem; z-index:200;
    background:rgba(0,0,0,.5); border:none;
    width:56px; height:56px; border-radius:50%;
    font-size:1.8rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(8px);
    border:1.5px solid rgba(255,255,255,.15);
    transition:transform .15s;
    -webkit-tap-highlight-color:transparent;
  }
  #heart-btn:active { transform:scale(.88); }
  #heart-btn.liked { animation:heartPop .3s ease; }
  @keyframes heartPop {
    0%  { transform:scale(1); }
    50% { transform:scale(1.35); }
    100%{ transform:scale(1); }
  }

  /* ── Heart float (locale, feedback visivo immediato) ─── */
  .local-heart {
    position:fixed; font-size:1.5rem; pointer-events:none;
    animation:localFloat 1.2s ease-out forwards; z-index:300;
  }
  @keyframes localFloat {
    0%   { opacity:1; transform:translateY(0) scale(1); }
    100% { opacity:0; transform:translateY(-120px) scale(.5); }
  }

  /* ── Tracking badge (debug, visibile solo in DEV) ────── */
  #track-badge {
    display:none; /* attiva in dev: display:block */
    position:fixed; top:10px; left:10px; z-index:999;
    background:rgba(0,0,0,.7); color:#0f0; font-size:.6rem;
    font-family:monospace; padding:.4rem .6rem; border-radius:6px;
    max-width:200px; line-height:1.5;
  }

  /* ── Loader iniziale (sostituisce il banner "Connessione in corso…") ── */
  #loader-overlay {
    position:fixed; inset:0; z-index:500;
    display:flex; align-items:center; justify-content:center;
    transition:opacity .3s;
  }
  #loader-overlay.hide { opacity:0; pointer-events:none; }

  .loader {
    height: 70px;
    aspect-ratio: 1;
    animation: l9 2s infinite linear;
    background: #3a86ff;
  }

    0%,to {clip-path: shape(from 88.17% 44.57%,curve to 83.91% 54.42% with 80.53% 50.00%,curve to 87.09% 63.68% with 87.29% 58.84%,curve to 82.15% 70.76% with 86.89% 68.52%,curve to 78.45% 81.30% with 77.42% 73.00%,curve to 73.45% 89.98% with 79.48% 89.60%,curve to 62.06% 89.23% with 67.41% 90.37%,curve to 52.45% 84.62% with 56.72% 88.09%,curve to 43.33% 84.81% with 48.19% 81.14%,curve to 35.31% 84.71% with 38.48% 88.49%,curve to 27.93% 79.39% with 32.14% 80.93%,curve to 23.86% 72.48% with 23.73% 77.85%,curve to 21.30% 64.27% with 23.99% 67.11%,curve to 20.07% 57.38% with 18.60% 61.43%,curve to 13.68% 49.08% with 21.53% 53.33%,curve to 11.55% 41.46% with 5.84% 44.84%,curve to 13.34% 30.70% with 17.26% 38.08%,curve to 13.91% 19.90% with 9.42% 23.31%,curve to 25.30% 17.85% with 18.39% 16.50%,curve to 34.95% 14.04% with 32.22% 19.20%,curve to 42.89% 13.03% with 37.69% 8.89%,curve to 52.68% 12.97% with 48.09% 17.17%,curve to 59.46% 15.87% with 57.27% 8.77%,curve to 66.23% 22.52% with 61.66% 22.97%,curve to 78.26% 21.04% with 70.80% 22.07%,curve to 85.25% 26.28% with 85.73% 20.02%,curve to 90.29% 35.84% with 84.77% 32.54%,curve to 88.17% 44.57% with 95.81% 39.14%)}
    34% {clip-path: shape(from 85.64% 45.40%,curve to 80.17% 53.30% with 82.48% 50.00%,curve to 83.85% 63.31% with 77.85% 56.60%,curve to 84.76% 72.45% with 89.85% 70.01%,curve to 76.40% 77.98% with 79.67% 74.90%,curve to 67.03% 78.20% with 73.13% 81.07%,curve to 57.66% 75.10% with 60.93% 75.33%,curve to 51.01% 82.71% with 54.39% 74.88%,curve to 43.15% 89.22% with 47.64% 90.54%,curve to 36.03% 83.32% with 38.66% 87.89%,curve to 32.48% 74.15% with 33.40% 78.75%,curve to 25.78% 69.64% with 31.55% 69.55%,curve to 15.32% 67.02% with 20.02% 69.72%,curve to 9.98% 59.54% with 10.63% 64.33%,curve to 6.34% 49.65% with 9.34% 54.75%,curve to 6.78% 40.03% with 3.35% 44.55%,curve to 12.58% 31.23% with 10.20% 35.52%,curve to 20.32% 25.59% with 14.95% 26.95%,curve to 28.84% 21.52% with 25.69% 24.23%,curve to 36.55% 19.54% with 31.99% 18.80%,curve to 44.10% 10.28% with 41.10% 20.28%,curve to 52.59% 2.25% with 47.10% 0.29%,curve to 62.64% 7.16% with 58.07% 4.21%,curve to 69.87% 14.93% with 67.20% 10.12%,curve to 72.61% 25.35% with 72.53% 19.74%,curve to 82.58% 29.82% with 72.68% 30.97%,curve to 90.63% 34.74% with 92.47% 28.67%,curve to 85.64% 45.40% with 88.80% 40.81%)}

  }
</style>

<body>

<div id="loader-overlay"><div class="loader"></div></div>
<div id="reel"></div>
<div id="dots"></div>
<button id="heart-btn">🤍</button>
<div id="track-badge"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
'use strict';

const CFG     = window.APP_CONFIG;
const SLIDES  = CFG.slides;
const N       = SLIDES.length;

// ═══════════════════════════════════════════════════════════
// SUPABASE
// ═══════════════════════════════════════════════════════════
const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey);

// ═══════════════════════════════════════════════════════════
// SESSION
// ═══════════════════════════════════════════════════════════
const SESSION_ID = crypto.randomUUID();

function detectBrowser() {
  const ua = navigator.userAgent;
  if (/Edg\//i.test(ua))    return 'Edge';
  if (/OPR\//i.test(ua))    return 'Opera';
  if (/Samsung/i.test(ua))  return 'Samsung';
  if (/Chrome/i.test(ua))   return 'Chrome';
  if (/Firefox/i.test(ua))  return 'Firefox';
  if (/Safari/i.test(ua))   return 'Safari';
  return 'Altro';
}
function detectOS() {
  const ua = navigator.userAgent;
  if (/iPhone|iPad/i.test(ua)) return 'iOS';
  if (/Android/i.test(ua))     return 'Android';
  if (/Windows/i.test(ua))     return 'Windows';
  if (/Mac/i.test(ua))         return 'macOS';
  return 'Altro';
}

const SESSION = {
  id:         SESSION_ID,
  browser:    detectBrowser(),
  os:         detectOS(),
  is_mobile:  /Mobi|Android|iPhone/i.test(navigator.userAgent),
  screen_w:   screen.width,
  screen_h:   screen.height,
  dpr:        devicePixelRatio || 1,
  language:   navigator.language || 'N/D',
  timezone:   Intl.DateTimeFormat().resolvedOptions().timeZone || 'N/D',
  conn_type:  navigator.connection?.effectiveType || 'N/D',
};

// Modello del dispositivo: Client Hints su Chrome/Android lo dà per nome
// (es. "Pixel 8 Pro"); su iOS Safari non è recuperabile (Apple lo anonimizza
// deliberatamente dal 2019). Come ripiego, il renderer GPU via WebGL è
// spesso un indizio sul chip/modello anche quando lo User-Agent non lo dice.
//
// Alcuni browser orientati alla privacy (Brave in particolare) restituiscono
// deliberatamente un valore "model" fasullo — es. letteralmente "Brave" —
// come misura anti-fingerprinting: va scartato, non è un modello di device.
const FAKE_MODEL_VALUES = /^(chrome|firefox|safari|edge|opera|brave|samsung ?(internet|browser)|vivaldi|yandex|uc ?browser)$/i;

function isUsableModelString(s) {
  return !!s && !FAKE_MODEL_VALUES.test(s.trim());
}

async function getDeviceModel() {
  if (navigator.userAgentData?.getHighEntropyValues) {
    try {
      const hints = await navigator.userAgentData.getHighEntropyValues(['model']);
      if (isUsableModelString(hints.model)) return hints.model;
    } catch (e) { /* non supportato/negato, si passa al ripiego */ }
  }
  try {
    const canvas = document.createElement('canvas');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    // Brave blocca di proposito questa extension (torna null): il ripiego
    // si ferma qui invece di inventarsi un valore.
    const ext = gl?.getExtension('WEBGL_debug_renderer_info');
    const renderer = ext && gl.getParameter(ext.UNMASKED_RENDERER_WEBGL);
    if (renderer && !/swiftshader|llvmpipe|software rasterizer/i.test(renderer)) {
      // I renderer "SwiftShader"/"llvmpipe" sono rasterizzatori software (GPU
      // disattivata): non dicono nulla sul dispositivo reale, si scartano.
      // Le stringhe ANGLE sono verbose (es. "ANGLE (ARM, Mali-G57 MC2,
      // OpenGL ES 3.2)"): estrarre solo il nome del chip le rende leggibili.
      const angleMatch = renderer.match(/ANGLE \([^,]+,\s*([^,]+),/i);
      return angleMatch ? angleMatch[1].trim() : renderer;
    }
  } catch (e) { /* ignorato */ }
  return null;
}

// Operatore/rete: il browser non lo sa, ma il proprio IP pubblico sì —
// lookup di terze parti (ipapi.co) sull'organizzazione associata all'IP.
async function getISP() {
  try {
    const res = await fetch('https://ipapi.co/json/');
    if (!res.ok) return null;
    const data = await res.json();
    return data.org || null;
  } catch (e) {
    return null;
  }
}

async function initSession() {
  const [deviceModel, isp] = await Promise.all([getDeviceModel(), getISP()]);
  const { error } = await sb.from('sessions').insert({ ...SESSION, device_model: deviceModel, isp });
  if (error) console.error('[Session] ❌ INSERT fallito:', error.message);
  else console.log('[Session] ✅ sessione creata:', SESSION_ID);
}

const sessionStart = Date.now();

// Chiudi/aggiorna la sessione ogni volta che la pagina sparisce dalla vista.
// beforeunload da solo NON basta: su mobile (iOS Safari, Chrome Android)
// spesso non viene mai sparato quando l'utente blocca lo schermo, cambia
// app o chiude la tab — per questo la maggior parte delle view/dwell non
// veniva mai salvata. visibilitychange + pagehide sono molto più affidabili.
function flushOnHide() {
  onSlideLeave(currentIndex);
  const totalMs = Date.now() - sessionStart;
  // Il builder di supabase-js è "thenable pigro": la richiesta HTTP parte solo
  // quando qualcosa consuma la promise (.then()/await). Senza .then() qui la
  // update non veniva MAI inviata, a prescindere da RLS.
  sb.from('sessions').update({ ended_at: new Date().toISOString(), total_ms: totalMs })
    .eq('id', SESSION_ID)
    .then(({ error }) => {
      if (error) console.error('[Session] ❌ update fallito:', error.message);
    });
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    flushOnHide();
  } else {
    // L'utente torna sulla pagina (es. sblocca il telefono): riprendi il timer
    onSlideEnter(currentIndex);
  }
});

window.addEventListener('pagehide', flushOnHide);
window.addEventListener('beforeunload', flushOnHide);

// ═══════════════════════════════════════════════════════════
// REEL RENDERING
// ═══════════════════════════════════════════════════════════
const reelEl   = document.getElementById('reel');
const dotsEl   = document.getElementById('dots');

function renderSlides() {
  SLIDES.forEach((slide, i) => {
    const div = document.createElement('div');
    div.className = 'slide';
    div.dataset.index = i;
    div.style.top = (i * 100) + 'dvh';

    if (slide.type === 'image') {
      const img = document.createElement('img');
      img.className = 'slide-image';
      img.src = slide.src;
      img.alt = slide.label || '';
      img.draggable = false;
      div.appendChild(img);
    } else {
      // Text slide
      div.style.background = slide.bg || '#0d0d0d';
      div.innerHTML = `
        <div class="slide-text">
          ${slide.eyebrow ? `<div class="slide-eyebrow" style="color:${slide.accent||'#fff'}">${slide.eyebrow}</div>` : ''}
          <div class="slide-title" style="color:${slide.accent||'#fff'}">${(slide.title||'').replace(/\n/g,'<br>')}</div>
          ${slide.body ? `<div class="slide-body">${slide.body}</div>` : ''}
        </div>
        ${slide.footer ? `<div class="slide-footer">${slide.footer}</div>` : ''}
      `;
    }
    reelEl.appendChild(div);

    // Dot
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.dataset.index = i;
    dotsEl.appendChild(dot);
  });
}

// ═══════════════════════════════════════════════════════════
// SCROLL ENGINE
// ═══════════════════════════════════════════════════════════
let currentIndex = 0;

function goTo(index, animate = true) {
  const newIndex = ((index % N) + N) % N;
  const prev = currentIndex;
  currentIndex = newIndex;

  if (!animate) {
    reelEl.style.transition = 'none';
  } else {
    reelEl.style.transition = 'transform 0.38s cubic-bezier(0.25,0.46,0.45,0.94)';
  }

  reelEl.style.transform = `translateY(${-currentIndex * 100}dvh)`;

  // Update dots
  document.querySelectorAll('.dot').forEach(d => {
    d.classList.toggle('active', parseInt(d.dataset.index) === currentIndex);
  });

  // Tracking
  if (prev !== currentIndex) onSlideLeave(prev);
  onSlideEnter(currentIndex);
}

// ═══════════════════════════════════════════════════════════
// TOUCH TRACKING
// ═══════════════════════════════════════════════════════════
let touchStartY  = 0;
let touchStartX  = 0;
let touchStartT  = 0;
let isDragging   = false;
let dragOffset   = 0;

// Tracking per slide corrente
const slideTimers = {};  // { index: { enterAt, dwell, pauses, touches: [] } }
let pauseTimer = null;
let pauseStart = null;

function onSlideEnter(idx) {
  if (!slideTimers[idx]) {
    slideTimers[idx] = { enterAt: Date.now(), dwell: 0, pauses: [], touches: [], revisits: 0 };
  } else {
    const t = slideTimers[idx];
    if (t.enterAt === null) t.revisits++; // vera revisita solo se era stata chiusa da un flush
    t.enterAt = Date.now(); // (re)avvia il timer
  }
  // Start pause detection (≥2s fermo = vera attenzione)
  clearTimeout(pauseTimer);
  pauseTimer = setTimeout(() => {
    pauseStart = Date.now();
  }, 2000);
}

function onSlideLeave(idx) {
  const t = slideTimers[idx];
  if (!t || t.enterAt === null) return; // niente di nuovo da salvare (già flushato)
  const now = Date.now();
  const enterHour = new Date(t.enterAt).getHours();
  t.dwell += now - t.enterAt;
  t.enterAt = null; // marca come flushato: evita doppi insert se richiamata di nuovo

  // Chiudi pausa se aperta
  if (pauseStart) {
    t.pauses.push(now - pauseStart);
    pauseStart = null;
  }
  clearTimeout(pauseTimer);

  // Calcola touch side
  const avgX = t.touches.length
    ? t.touches.reduce((s, tx) => s + tx, 0) / t.touches.length
    : 0.5;
  const side = avgX < 0.35 ? 'left' : avgX > 0.65 ? 'right' : 'center';
  const dwell = t.dwell;

  // Salva view su Supabase (async, non blocca)
  sb.from('image_views').insert({
    session_id:    SESSION_ID,
    image_index:   idx,
    image_label:   SLIDES[idx]?.label || String(idx),
    dwell_ms:      Math.round(dwell),
    enter_hour:    enterHour,
    max_pause_ms:  t.pauses.length ? Math.max(...t.pauses) : 0,
    touch_side:    side,
    touch_x_avg:   parseFloat(avgX.toFixed(3)),
    revisit_count: t.revisits,
  }).then(({ error }) => {
    if (error) console.error('[View] ❌ INSERT fallito slide', idx, ':', error.message);
    else console.log('[View] ✅ slide', idx, SLIDES[idx]?.label, '— dwell:', Math.round(dwell) + 'ms', 'side:', side);
  });

  updateDebug(idx, dwell, side, avgX);

  // Reset del segmento: la prossima entrata inizia a contare da zero
  t.dwell = 0;
  t.pauses = [];
  t.touches = [];
}

document.addEventListener('touchstart', (e) => {
  if (e.target instanceof Element && e.target.closest('#heart-btn')) return; // gestito direttamente dal bottone
  const touch = e.touches[0];
  touchStartY = touch.clientY;
  touchStartX = touch.clientX;
  touchStartT = Date.now();
  isDragging  = true;
  dragOffset  = 0;

  // Registra X per hand detection
  const xPct = touch.clientX / window.innerWidth;
  if (!slideTimers[currentIndex]) slideTimers[currentIndex] = { enterAt: Date.now(), dwell: 0, pauses: [], touches: [], revisits: 0 };
  slideTimers[currentIndex].touches.push(xPct);

  // Interrompi pausa timer durante il movimento
  clearTimeout(pauseTimer);
  if (pauseStart) {
    const pauseDur = Date.now() - pauseStart;
    if (slideTimers[currentIndex]) slideTimers[currentIndex].pauses.push(pauseDur);
    pauseStart = null;
  }
}, { passive: true });

document.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  const dy = touchStartY - e.touches[0].clientY;
  dragOffset = dy;
  // Trascina il reel in tempo reale
  reelEl.style.transition = 'none';
  reelEl.style.transform = `translateY(calc(${-currentIndex * 100}dvh - ${dy}px))`;
}, { passive: true });

document.addEventListener('touchend', (e) => {
  if (!isDragging) return; // già gestito (es. bottone heart)
  isDragging = false;

  const touch = e.changedTouches[0];
  const dy  = touchStartY - touch.clientY;
  const dt  = Date.now() - touchStartT;
  const vel = dy / dt; // px/ms (positivo = swipe up = slide successiva)

  const SWIPE_THRESHOLD = 60;  // px
  const VEL_THRESHOLD   = 0.25; // px/ms

  let nextIndex = currentIndex;

  if (Math.abs(dy) > SWIPE_THRESHOLD || Math.abs(vel) > VEL_THRESHOLD) {
    nextIndex = dy > 0 ? currentIndex + 1 : currentIndex - 1;

    // Registra scroll event.
    // Il builder di supabase-js è "thenable pigro": senza .then()/await la
    // richiesta HTTP non viene MAI inviata (verificato: nessuna richiesta di
    // rete parte se la promise non viene consumata) — per questo scroll_events
    // era pressoché sempre vuota, indipendentemente da isAnimating o soglie.
    const dir = dy > 0 ? 'next' : 'prev';
    sb.from('scroll_events').insert({
      session_id:  SESSION_ID,
      from_index:  currentIndex,
      to_index:    ((nextIndex % N) + N) % N,
      direction:   dir,
      velocity:    parseFloat(vel.toFixed(4)),
      duration_ms: dt,
      touch_x_pct: parseFloat((touchStartX / window.innerWidth).toFixed(3)),
    }).then(({ error }) => {
      if (error) console.error('[Scroll] ❌ INSERT fallito:', error.message);
    });
  }

  goTo(nextIndex);

  // Riavvia pausa timer sulla nuova slide
  clearTimeout(pauseTimer);
  pauseTimer = setTimeout(() => { pauseStart = Date.now(); }, 2000);
}, { passive: true });

// Scroll da mouse (desktop testing) — debounce dedicato: un trackpad genera
// decine di eventi wheel per un solo gesto, altrimenti si saltano più slide.
let lastWheelAt = 0;
document.addEventListener('wheel', (e) => {
  const now = Date.now();
  if (now - lastWheelAt < 400) return;
  if (e.deltaY > 40) { lastWheelAt = now; goTo(currentIndex + 1); }
  else if (e.deltaY < -40) { lastWheelAt = now; goTo(currentIndex - 1); }
}, { passive: true });

// ═══════════════════════════════════════════════════════════
// HEARTS
// ═══════════════════════════════════════════════════════════
const HEART_COOLDOWN = 2000; // ms tra un like e l'altro per stessa slide
const lastHeartPerSlide = {};

// Gestione touch diretta sul bottone: stopPropagation impedisce
// al gestore scroll globale di intercettare il tap
;(function () {
  const btn = document.getElementById('heart-btn');
  btn.addEventListener('touchstart', (e) => {
    e.stopPropagation(); // blocca il touchstart globale
  }, { passive: true });
  btn.addEventListener('touchend', (e) => {
    e.stopPropagation(); // blocca il touchend globale (evita goTo)
    sendHeart(e);
  }, { passive: true });
  btn.addEventListener('click', sendHeart); // desktop / fallback
})();

async function sendHeart(e) {
  const now = Date.now();
  if (lastHeartPerSlide[currentIndex] && now - lastHeartPerSlide[currentIndex] < HEART_COOLDOWN) return;
  lastHeartPerSlide[currentIndex] = now;

  // Feedback visivo immediato
  const btn = document.getElementById('heart-btn');
  btn.textContent = '❤️';
  btn.classList.add('liked');
  setTimeout(() => { btn.classList.remove('liked'); btn.textContent = '🤍'; }, 500);

  // Float heart locale
  const fl = document.createElement('div');
  fl.className = 'local-heart';
  fl.textContent = '❤️';
  fl.style.right = '1.5rem';
  fl.style.bottom = '4rem';
  document.body.appendChild(fl);
  fl.addEventListener('animationend', () => fl.remove());

  // Touch position per hand analysis.
  // Su touchend il dito appena alzato è in changedTouches, NON in touches
  // (che a quel punto è già vuoto) — per questo su mobile finiva sempre
  // sul default 0.5 (centro). changedTouches copre touchend, e.clientX
  // copre il click da mouse/desktop.
  const touch = e?.changedTouches?.[0] || e?.touches?.[0];
  const xPct = touch
    ? touch.clientX / window.innerWidth
    : (typeof e?.clientX === 'number' ? e.clientX / window.innerWidth : 0.5);

  // Salva su Supabase (triggera realtime su index.html)
  const { error: hErr } = await sb.from('hearts').insert({
    session_id:  SESSION_ID,
    image_index: currentIndex,
    image_label: SLIDES[currentIndex]?.label || String(currentIndex),
    touch_x_pct: parseFloat(xPct.toFixed(3)),
    hour_of_day: new Date().getHours(),
  });
  if (hErr) console.error('[Heart] ❌ INSERT fallito:', hErr.message);
  else console.log('[Heart] ✅ INSERT OK — slide:', SLIDES[currentIndex]?.label);
}

// ═══════════════════════════════════════════════════════════
// DEBUG (solo sviluppo)
// ═══════════════════════════════════════════════════════════
function updateDebug(idx, dwell, side, avgX) {
  const el = document.getElementById('track-badge');
  if (el.style.display === 'none') return;
  el.innerHTML = `Slide: ${idx}<br>Tempo: ${(dwell/1000).toFixed(1)}s<br>Mano: ${side}<br>X avg: ${avgX.toFixed(2)}`;
}

// ═══════════════════════════════════════════════════════════
// PRESENCE (per il contatore "N connessi" sullo schermo principale)
// ═══════════════════════════════════════════════════════════
// Usa la Presence di Supabase Realtime invece di un semplice conteggio di
// INSERT su sessions: quel conteggio saliva soltanto e non si accorgeva mai
// di chi chiudeva la pagina. La Presence traccia la connessione WebSocket
// stessa — quando questa cade (tab chiusa, telefono spento, rete persa),
// Supabase rimuove automaticamente la voce, senza bisogno di heartbeat.
function joinPresence() {
  const presenceChannel = sb.channel('live', { config: { presence: { key: SESSION_ID } } });
  presenceChannel.subscribe((status) => {
    if (status === 'SUBSCRIBED') {
      presenceChannel.track({ online_at: new Date().toISOString() });
    }
  });
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
async function init() {
  await initSession();
  joinPresence();
  document.getElementById('loader-overlay').classList.add('hide');

  renderSlides();
  goTo(0, false);

  // Preload immagini
  SLIDES.filter(s => s.type === 'image').forEach(s => {
    const img = new Image(); img.src = s.src;
  });
}

init();
</script>
</body>
